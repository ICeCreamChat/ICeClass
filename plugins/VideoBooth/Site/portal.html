<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5f0f8"><title>视频展台 · 手机摄像头</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/control-focus.css"><script type="module" src="/assets/portal.js"></script></head>
<body class="phone"><main class="phone-shell"><header class="phone-heading"><h1>视频展台</h1><span id="phoneConnection" class="phone-connection">正在连接</span></header>
<div class="phone-stage"><video id="phoneVideo" autoplay muted playsinline></video><div id="phoneEmpty" class="empty-state"><h2 id="phoneEmptyTitle">手机摄像头</h2><p id="phoneEmptyMessage">点击开始展示</p></div></div>
<div class="phone-controls"><button id="connectComputer" class="primary wide" type="button" disabled>连接电脑</button><div id="facingControls" class="facing-tabs" role="group" aria-label="手机摄像头" hidden><button id="backCamera" class="selected" aria-pressed="true" type="button">后置摄像头</button><button id="frontCamera" aria-pressed="false" type="button">前置摄像头</button></div><div class="orientation-controls" role="group" aria-label="画面方向"><button id="lockOrientation" aria-pressed="false" type="button" disabled>锁定方向</button><button id="rotateVideo" type="button" disabled>旋转 90°</button></div><button id="startPhone" class="primary wide" type="button">开始展示</button><button id="stopPhone" class="secondary wide" type="button" disabled>停止展示</button><p id="phoneStatus" class="phone-status" role="status" aria-live="polite">正在连接电脑…</p><p id="browserHelp" class="small-note" hidden></p><p class="small-note">展示时保持此页面打开。只传画面，不采集声音。</p></div></main></body></html>
