name = "iceclass"
main = "cloud/src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./web_controller"
binding = "ASSETS"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "iceclass"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "cloud/migrations"

[[durable_objects.bindings]]
name = "CLASS_ROOMS"
class_name = "ClassRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassRoom"]

[vars]
APP_NAME = "ICeClass 班伴"
SESSION_DAYS = "14"
HISTORY_DAYS = "0"

[triggers]
crons = ["0 19 * * *"]
