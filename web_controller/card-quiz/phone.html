<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>手机扫码 · ICeClass 纸卡答题</title><link rel="stylesheet" href="../assets/control-focus.css"><link rel="stylesheet" href="phone.css"><script src="vendor/cv.js" defer></script><script src="vendor/aruco.js" defer></script><script src="scanner.js" defer></script><script src="phone.js" defer></script></head><body>
  <main class="phone-shell"><header><h1>手机扫码</h1><p id="account" class="muted"></p></header><p id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true">正在检查登录…</p>
    <section id="login" class="surface" hidden><h2>登录教师账号</h2><form id="login-form"><label>账号<input id="username" autocomplete="username" required maxlength="64"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary" type="submit">登录并继续</button></form></section>
    <section id="pairing" class="surface" hidden><h2>连接教室白板</h2><form id="pair-form"><label>白板上的配对码<input id="code" autocomplete="off" spellcheck="false" maxlength="128" required></label><button type="submit" class="primary">配对本课堂</button></form><p class="muted">请先在教室端开始课堂，再选择使用手机。配对完成后需在白板确认切换。</p></section>
    <section id="capture" hidden><div class="surface"><div class="capture-heading"><h2 id="class-name"></h2><button id="disconnect" type="button">断开手机</button></div><p id="question-label" class="question-label"></p><p id="connection" role="status"></p><div class="capture-count"><strong id="received">0</strong><span id="expected"> / 0 人已收</span></div>
      <div id="multi-capture" class="multi-capture" hidden><div class="multi-controls"><label>当前收答项<select id="multi-option" aria-describedby="multi-instruction"></select></label><button id="multi-next" type="button">收下一项</button></div><p id="multi-instruction">A 朝上表示选，B 朝上表示不选。</p><p id="multi-progress" class="muted" role="status" aria-live="polite"></p></div><video id="camera" muted playsinline aria-label="手机相机预览"></video><p id="camera-status" class="muted" role="status">视频仅在手机本机识别。</p><p id="submission-status" role="status" aria-live="polite"></p><div class="actions"><button id="start" type="button" class="primary" disabled>开始收答</button><button id="stop" type="button" disabled>结束本轮</button><button id="camera-toggle" type="button" disabled>开启相机</button></div></div><section class="surface"><h2>课件控制</h2><div class="question-fields"><label>下一题题型<select id="next-type"><option value="single">单选</option><option value="boolean">判断（A 正确，B 错误）</option><option value="multiple">多选（逐项收答）</option></select></label><label>选项数量<select id="next-count"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></label></div><div class="actions"><button id="next" type="button" disabled>添加课件临时题</button><button id="reveal" type="button" disabled>本题已在课件讲解</button></div><p class="muted">题单翻题和结束课堂可在白板操作。</p></section></section>
    <section id="question-settings" class="surface"><h2>本场题目信息</h2><form id="question-form"><label>修改内容<select id="edit-field"><option value="answer">标准答案（A/B/C/D，留空取消）</option><option value="tags">知识点（逗号分隔，留空清除）</option><option value="text">题干（留空清除）</option></select></label><label id="edit-value-label">新的内容<textarea id="edit-value" rows="3" maxlength="40000"></textarea></label><fieldset id="edit-multiple-answer" class="answer-choices" hidden><legend>新的标准答案（可选多个，不选则暂不设置）</legend><div id="edit-multiple-options"></div></fieldset><div class="actions"><button id="question-edit" type="submit" disabled>保存到本场题目</button><button id="edit-reset" type="button">清空重填</button></div></form><p class="muted">仅在轮次之间修改所选内容；设置标准答案不会揭晓。题单翻题和结束课堂请在白板操作。</p></section>
  </main></body></html>
